<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="1320" fill="#FBF7EE"/>
<defs><pattern id="card" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#C99A62"/><line x1="0" y1="7" x2="14" y2="7" stroke="#BB8B55" stroke-width="2"/></pattern></defs>
<text x="800" y="56" text-anchor="middle" font-size="36" font-weight="bold" fill="#3B2A17">Island Colony controller: the cardboard box</text>
<text x="800" y="92" text-anchor="middle" font-size="20" fill="#6B5537">Box about 24 × 15 × 7 cm (a shoebox lid works). Everything sits on the lid; the ESP32 and breadboard sit on the floor of the box.</text>
<text x="400" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#3B2A17">1. The lid, from above (cm)</text>
<rect x="48" y="190" width="720" height="450" rx="18" fill="#00000030"/>
<rect x="40" y="180" width="720" height="450" rx="18" fill="url(#card)" stroke="#7A5530" stroke-width="5"/>
<text x="400.0" y="228" text-anchor="middle" font-size="30" font-weight="bold" fill="#5A3A1A" letter-spacing="3">ISLAND COLONY</text>
<circle cx="220" cy="435.0" r="48.0" fill="#3A2A1A"/><circle cx="220" cy="435.0" r="33.0" fill="#222"/><circle cx="220" cy="435.0" r="22.5" fill="#444" stroke="#111" stroke-width="3"/>
<text x="220" y="507.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#3B2A17">JOYSTICK</text>
<text x="220" y="531.0" text-anchor="middle" font-size="15" fill="#4A3520">hole: 3.2 cm circle</text>
<circle cx="580" cy="357.0" r="28.5" fill="#3A2A1A"/><circle cx="580" cy="357.0" r="22.5" fill="#2D6FD0" stroke="#00000055" stroke-width="3"/>
<text x="580" y="320.5" text-anchor="middle" font-size="17" font-weight="bold" fill="#2A1A0A">MENU</text>
<circle cx="658.0" cy="435.0" r="33.0" fill="#3A2A1A"/><circle cx="658.0" cy="435.0" r="27.0" fill="#2E9E4F" stroke="#00000055" stroke-width="3"/>
<text x="658.0" y="488.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2A1A0A">ACTION</text>
<circle cx="580" cy="513.0" r="28.5" fill="#3A2A1A"/><circle cx="580" cy="513.0" r="22.5" fill="#E08A1E" stroke="#00000055" stroke-width="3"/>
<text x="580" y="561.5" text-anchor="middle" font-size="17" font-weight="bold" fill="#2A1A0A">BUILD</text>
<circle cx="502.0" cy="435.0" r="28.5" fill="#3A2A1A"/><circle cx="502.0" cy="435.0" r="22.5" fill="#D6B21E" stroke="#00000055" stroke-width="3"/>
<text x="502.0" y="483.5" text-anchor="middle" font-size="17" font-weight="bold" fill="#2A1A0A">SELECT</text>
<text x="580" y="440.0" text-anchor="middle" font-size="13" fill="#4A3520">1.2 cm holes</text>
<circle cx="400" cy="267.0" r="22" fill="#3A2A1A"/><circle cx="400" cy="267.0" r="15" fill="#8CFFB0" stroke="#fff" stroke-width="3"/><circle cx="400" cy="267.0" r="30" fill="none" stroke="#8CFFB077" stroke-width="6"/>
<text x="445" y="273.0" font-size="16" font-weight="bold" fill="#2A1A0A">STATUS LIGHT</text>
<circle cx="130" cy="261.0" r="4" fill="#3A2A1A"/>
<circle cx="130" cy="275.0" r="4" fill="#3A2A1A"/>
<circle cx="130" cy="289.0" r="4" fill="#3A2A1A"/>
<circle cx="144" cy="261.0" r="4" fill="#3A2A1A"/>
<circle cx="144" cy="275.0" r="4" fill="#3A2A1A"/>
<circle cx="144" cy="289.0" r="4" fill="#3A2A1A"/>
<circle cx="158" cy="261.0" r="4" fill="#3A2A1A"/>
<circle cx="158" cy="275.0" r="4" fill="#3A2A1A"/>
<circle cx="158" cy="289.0" r="4" fill="#3A2A1A"/>
<text x="124" y="323.0" font-size="14" fill="#2A1A0A">buzzer holes</text>
<rect x="370.0" y="624" width="60" height="14" fill="#FBF7EE" stroke="#7A5530" stroke-width="3"/>
<text x="400.0" y="664" text-anchor="middle" font-size="16" fill="#4A3520">USB cable hole in the back wall (1.5 × 1 cm)</text>
<text x="400.0" y="170" text-anchor="middle" font-size="15" fill="#6B5537">24 cm</text>
<text x="774" y="405.0" font-size="15" fill="#6B5537">15 cm</text>
<text x="1200" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#3B2A17">2. Inside, cut open from the side</text>
<rect x="830" y="230" width="640" height="330" fill="#F3E6CF" stroke="#7A5530" stroke-width="6"/>
<rect x="820" y="212" width="660" height="18" fill="url(#card)" stroke="#7A5530" stroke-width="4"/>
<text x="1460" y="204" text-anchor="end" font-size="15" fill="#6B5537">lid</text>
<rect x="920" y="260" width="120" height="16" fill="#2A2A2A"/><rect x="942" y="234" width="76" height="26" fill="#444"/><rect x="972" y="178" width="16" height="56" fill="#222"/><circle cx="980" cy="174" r="16" fill="#333"/>
<line x1="930" y1="260" x2="930" y2="230" stroke="#999" stroke-width="5"/><line x1="1030" y1="260" x2="1030" y2="230" stroke="#999" stroke-width="5"/>
<rect x="1138" y="244" width="44" height="10" fill="#2D6A3D"/><rect x="1146" y="230" width="28" height="14" fill="#333"/><rect x="1150" y="214" width="20" height="16" rx="4" fill="#D6B21E"/>
<rect x="1218" y="244" width="44" height="10" fill="#2D6A3D"/><rect x="1226" y="230" width="28" height="14" fill="#333"/><rect x="1230" y="214" width="20" height="16" rx="4" fill="#2E9E4F"/>
<rect x="1298" y="244" width="44" height="10" fill="#2D6A3D"/><rect x="1306" y="230" width="28" height="14" fill="#333"/><rect x="1310" y="214" width="20" height="16" rx="4" fill="#E08A1E"/>
<rect x="1420" y="234" width="40" height="14" fill="#222"/><circle cx="1440" cy="228" r="8" fill="#8CFFB0"/>
<text x="1440" y="270" text-anchor="middle" font-size="14" fill="#3B2A17">LED</text>
<circle cx="890" cy="254" r="18" fill="#111"/><text x="890" y="292" text-anchor="middle" font-size="14" fill="#3B2A17">buzzer</text>
<rect x="1000" y="510" width="360" height="40" rx="4" fill="#EEE" stroke="#BBB" stroke-width="2"/>
<rect x="1090" y="486" width="180" height="26" rx="3" fill="#1E2A38"/><text x="1180" y="504" text-anchor="middle" font-size="14" fill="#fff">ESP32</text>
<rect x="1270" y="492" width="20" height="12" fill="#999"/>
<path d="M1290,498 C1430,498 1470,520 1550,520" fill="none" stroke="#333" stroke-width="7"/>
<rect x="1466" y="508" width="12" height="24" fill="#FBF7EE"/>
<text x="1480" y="502" font-size="15" fill="#3B2A17">USB to laptop</text>
<path d="M890,268 C890,400 1010,380 1010,510" fill="none" stroke="#F1C40F" stroke-width="3.5"/>
<path d="M960,268 C960,400 1038,380 1038,510" fill="none" stroke="#8E44AD" stroke-width="3.5"/>
<path d="M970,268 C970,400 1066,380 1066,510" fill="none" stroke="#E67E22" stroke-width="3.5"/>
<path d="M980,268 C980,400 1094,380 1094,510" fill="none" stroke="#16A085" stroke-width="3.5"/>
<path d="M990,268 C990,400 1122,380 1122,510" fill="none" stroke="#D33" stroke-width="3.5"/>
<path d="M1000,268 C1000,400 1150,380 1150,510" fill="none" stroke="#222" stroke-width="3.5"/>
<path d="M1160,268 C1160,400 1178,380 1178,510" fill="none" stroke="#2E9E4F" stroke-width="3.5"/>
<path d="M1240,268 C1240,400 1206,380 1206,510" fill="none" stroke="#E08A1E" stroke-width="3.5"/>
<path d="M1320,268 C1320,400 1234,380 1234,510" fill="none" stroke="#D6B21E" stroke-width="3.5"/>
<path d="M1350,268 C1350,400 1262,380 1262,510" fill="none" stroke="#2D6FD0" stroke-width="3.5"/>
<path d="M1435,268 C1435,400 1290,380 1290,510" fill="none" stroke="#1ABC9C" stroke-width="3.5"/>
<text x="820" y="600" font-size="16" fill="#3B2A17">• Joystick hangs under its hole: hot glue it to 4 small cardboard spacers.</text>
<text x="820" y="626" font-size="16" fill="#3B2A17">• Buttons: glue each on a cardboard strip so only the cap pokes through the hole.</text>
<text x="820" y="652" font-size="16" fill="#3B2A17">• Use 20 cm male-to-female jumper wires, long enough that the lid can open.</text>
<text x="820" y="678" font-size="16" fill="#3B2A17">• Breadboard + ESP32 stuck to the floor with double-sided tape.</text>
<text x="820" y="704" font-size="16" fill="#3B2A17">• Tape one long edge of the lid as a hinge, so you can open it at the demo.</text>
<text x="800" y="780" text-anchor="middle" font-size="26" font-weight="bold" fill="#3B2A17">3. What each control does in the game</text>
<rect x="60" y="820" width="1480" height="50" rx="10" fill="#EFE4CC"/>
<circle cx="92" cy="845" r="14" fill="#444" stroke="#00000044" stroke-width="2"/>
<text x="120" y="852" font-size="19" font-weight="bold" fill="#3B2A17">JOYSTICK (move)</text>
<text x="400" y="852" font-size="18" fill="#3B2A17">Move around the map. In menus: up and down. While building: jump to the next square.</text>
<rect x="60" y="878" width="1480" height="50" rx="10" fill="#F6EEDC"/>
<circle cx="92" cy="903" r="14" fill="#444" stroke="#00000044" stroke-width="2"/>
<text x="120" y="910" font-size="19" font-weight="bold" fill="#3B2A17">JOYSTICK (press down)</text>
<text x="400" y="910" font-size="18" fill="#3B2A17">Back: close a menu, cancel building, decline an event.</text>
<rect x="60" y="936" width="1480" height="50" rx="10" fill="#EFE4CC"/>
<circle cx="92" cy="961" r="14" fill="#2E9E4F" stroke="#00000044" stroke-width="2"/>
<text x="120" y="968" font-size="19" font-weight="bold" fill="#3B2A17">ACTION (big green)</text>
<text x="400" y="968" font-size="18" fill="#3B2A17">Confirm: open a building, pick a menu item, accept an event, turn a puzzle card.</text>
<rect x="60" y="994" width="1480" height="50" rx="10" fill="#F6EEDC"/>
<circle cx="92" cy="1019" r="14" fill="#E08A1E" stroke="#00000044" stroke-width="2"/>
<text x="120" y="1026" font-size="19" font-weight="bold" fill="#3B2A17">BUILD (orange)</text>
<text x="400" y="1026" font-size="18" fill="#3B2A17">Start or stop placing a building.</text>
<rect x="60" y="1052" width="1480" height="50" rx="10" fill="#EFE4CC"/>
<circle cx="92" cy="1077" r="14" fill="#D6B21E" stroke="#00000044" stroke-width="2"/>
<text x="120" y="1084" font-size="19" font-weight="bold" fill="#3B2A17">SELECT (yellow)</text>
<text x="400" y="1084" font-size="18" fill="#3B2A17">Tap: jump to your next building.  Hold + joystick up/down: zoom, or change which building to place.</text>
<rect x="60" y="1110" width="1480" height="50" rx="10" fill="#F6EEDC"/>
<circle cx="92" cy="1135" r="14" fill="#2D6FD0" stroke="#00000044" stroke-width="2"/>
<text x="120" y="1142" font-size="19" font-weight="bold" fill="#3B2A17">MENU (blue)</text>
<text x="400" y="1142" font-size="18" fill="#3B2A17">Open the pause menu (save, settings, gold puzzle, next event).</text>
<rect x="60" y="1168" width="1480" height="50" rx="10" fill="#EFE4CC"/>
<circle cx="92" cy="1193" r="14" fill="#7CF29A" stroke="#00000044" stroke-width="2"/>
<text x="120" y="1200" font-size="19" font-weight="bold" fill="#3B2A17">STATUS LIGHT</text>
<text x="400" y="1200" font-size="18" fill="#3B2A17">Green: all fine.  Yellow: an event is on (blinks: answer it).  Red: starving or storage full.  Blue: building.  Flashing green: you won.</text>
<rect x="60" y="1226" width="1480" height="50" rx="10" fill="#F6EEDC"/>
<circle cx="92" cy="1251" r="14" fill="#222" stroke="#00000044" stroke-width="2"/>
<text x="120" y="1258" font-size="19" font-weight="bold" fill="#3B2A17">BUZZER</text>
<text x="400" y="1258" font-size="18" fill="#3B2A17">1 beep: building placed.  2 beeps: new event.  Long beep: game over.</text>
</svg>