<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="640" fill="#faf6ee"/>
<text x="450" y="38" font-size="24" font-weight="bold" fill="#3a2f1c" text-anchor="middle">White LED + 220 Ω resistor (zoom on the UPPER breadboard)</text>
<text x="450" y="64" font-size="15" fill="#4a4030" text-anchor="middle">The resistor sits IN the breadboard. Wires carry the signal to the LED on the cardboard.</text>
<rect x="250" y="95" width="400" height="430" rx="10" fill="#f4f1ea" stroke="#c9c2b2"/>
<g font-size="13" fill="#8a8272">
<text x="262" y="140">a</text><text x="262" y="175">b</text><text x="262" y="210">c</text><text x="262" y="245">d</text><text x="262" y="280">e</text>
<text x="262" y="355">f</text><text x="262" y="390">g</text><text x="262" y="425">h</text><text x="262" y="460">i</text><text x="262" y="495">j</text>
</g>
<text x="460" y="322" font-size="12" fill="#8a8272" text-anchor="middle">— middle gap: a-e and f-j are NOT joined —</text>
<g fill="#bdb6a6">
<rect x="321" y="129" width="12" height="12"/><rect x="321" y="164" width="12" height="12"/><rect x="321" y="199" width="12" height="12"/><rect x="321" y="234" width="12" height="12"/><rect x="321" y="269" width="12" height="12"/>
<rect x="561" y="129" width="12" height="12"/><rect x="561" y="164" width="12" height="12"/><rect x="561" y="199" width="12" height="12"/><rect x="561" y="234" width="12" height="12"/><rect x="561" y="269" width="12" height="12"/>
<rect x="321" y="344" width="12" height="12"/><rect x="321" y="379" width="12" height="12"/><rect x="321" y="414" width="12" height="12"/><rect x="321" y="449" width="12" height="12"/><rect x="321" y="484" width="12" height="12"/>
<rect x="561" y="344" width="12" height="12"/><rect x="561" y="379" width="12" height="12"/><rect x="561" y="414" width="12" height="12"/><rect x="561" y="449" width="12" height="12"/><rect x="561" y="484" width="12" height="12"/>
</g>
<!-- D27 column highlight -->
<rect x="431" y="120" width="32" height="170" rx="6" fill="#ffe6a8" stroke="#d4a017"/>
<rect x="431" y="335" width="32" height="170" rx="6" fill="#d6f0d2" stroke="#7cc576"/>
<g fill="#bdb6a6"><rect x="441" y="129" width="12" height="12"/><rect x="441" y="164" width="12" height="12"/><rect x="441" y="199" width="12" height="12"/><rect x="441" y="234" width="12" height="12"/><rect x="441" y="344" width="12" height="12"/><rect x="441" y="414" width="12" height="12"/><rect x="441" y="449" width="12" height="12"/></g>
<!-- ESP pin D27 in row j -->
<circle cx="447" cy="490" r="9" fill="#e8c35a" stroke="#7a6320"/>
<rect x="400" y="508" width="94" height="40" rx="6" fill="#1d2540"/>
<text x="447" y="533" font-size="14" fill="#fff" text-anchor="middle">ESP32 D27</text>
<!-- resistor from g to e, crossing the gap -->
<line x1="447" y1="385" x2="447" y2="275" stroke="#888" stroke-width="3"/>
<rect x="437" y="300" width="20" height="50" rx="6" fill="#d9b27a" stroke="#7a5a20" stroke-width="2"/>
<rect x="437" y="312" width="20" height="4" fill="#c0392b"/><rect x="437" y="321" width="20" height="4" fill="#c0392b"/><rect x="437" y="330" width="20" height="4" fill="#8b4513"/>
<circle cx="447" cy="385" r="6" fill="#555"/><circle cx="447" cy="275" r="6" fill="#555"/>
<!-- labels -->
<line x1="470" y1="385" x2="680" y2="385" stroke="#7a5a20" stroke-dasharray="4"/>
<text x="688" y="380" font-size="14" fill="#3a2f1c">① Resistor leg 1 → row g,</text>
<text x="688" y="398" font-size="14" fill="#3a2f1c">same column as D27</text>
<line x1="470" y1="275" x2="680" y2="275" stroke="#7a5a20" stroke-dasharray="4"/>
<text x="688" y="270" font-size="14" fill="#3a2f1c">② Resistor leg 2 → row e,</text>
<text x="688" y="288" font-size="14" fill="#3a2f1c">same column (across the gap)</text>
<!-- wire from row b to LED long leg -->
<polyline points="447,170 447,110 55,110 55,295 140,295 140,265" fill="none" stroke="#d4a017" stroke-width="4"/>
<circle cx="447" cy="170" r="6" fill="#d4a017"/>
<line x1="470" y1="170" x2="680" y2="170" stroke="#d4a017" stroke-dasharray="4"/>
<text x="688" y="165" font-size="14" fill="#3a2f1c">③ Wire (male end) → row b,</text>
<text x="688" y="183" font-size="14" fill="#3a2f1c">same column → LED LONG leg</text>
<!-- LED -->
<rect x="80" y="160" width="140" height="120" rx="10" fill="#fff" stroke="#c9c2b2"/>
<ellipse cx="150" cy="205" rx="22" ry="26" fill="#f4f4f4" stroke="#999"/>
<line x1="140" y1="231" x2="140" y2="265" stroke="#777" stroke-width="3"/><line x1="160" y1="231" x2="160" y2="255" stroke="#777" stroke-width="3"/>
<text x="150" y="190" font-size="12" fill="#333" text-anchor="middle">LED</text>
<text x="125" y="276" font-size="11" fill="#333" text-anchor="middle">long +</text><text x="182" y="268" font-size="11" fill="#333" text-anchor="middle">short −</text>
<!-- wire short leg to - rail -->
<polyline points="160,255 200,300 200,580 600,580" fill="none" stroke="#111" stroke-width="4"/>
<text x="610" y="585" font-size="14" fill="#3a2f1c">④ Wire: LED SHORT leg → − rail (GND)</text>
<text x="450" y="620" font-size="14" fill="#b5651d" text-anchor="middle">Female end of each wire slides onto the LED leg. If the LED stays dark, turn it round (swap the legs).</text>
</svg>
